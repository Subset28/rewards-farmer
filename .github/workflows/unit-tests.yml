name: Unit tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: All platform-agnostic tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Poetry
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: Install dependencies
        shell: bash
        run: poetry install --no-interaction

      # pytest, not unittest: tests/conftest.py (neutral pacing, a private data folder for every
      # test, all features on) only applies under pytest, and 60 tests fail without it.
      - name: Install the test tools
        shell: bash
        run: poetry run pip install pytest pyflakes

      - name: Lint (unused names, undefined names, syntax)
        shell: bash
        run: poetry run python -m pyflakes src tests

      - name: Run unit tests
        shell: bash
        run: |
          poetry run python -m pytest -q
