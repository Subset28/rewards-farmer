# Sign a profile in once, then run against it:
#
#   docker compose run --rm --service-ports signin
#   docker compose run --rm rewards-farmer
#
# For unattended daily runs at a varying time instead of one manual run, use
# the scheduler service, and search-scheduler to spread required searches
# across the day instead of doing them all in the same daily run:
#
#   docker compose up -d scheduler search-scheduler
#
# See the Docker section of the README.

services:
  rewards-farmer:
    build:
      context: .
      target: runtime
    # Distinct tag from signin's image on purpose: they are genuinely
    # different images (runtime has no Xvfb/VNC stack), and sharing one tag
    # would leave whichever was built last silently overwriting the other's
    # tag on this NAS's Docker daemon.
    image: rewards-farmer:runtime
    # Chromium wants more than the default 64MB of shared memory and crashes
    # partway through a page without it.
    shm_size: 1gb
    # Keeps the bot from crowding out everything else running on the NAS.
    # cpus is deliberately not set here: this NAS's kernel has no CFS quota
    # controller ("NanoCPUs can not be set..."), so a cpus limit makes the
    # container refuse to start at all rather than degrade gracefully.
    # Memory uses a different cgroup controller and still works.
    deploy:
      resources:
        limits:
          memory: 1536M
    environment:
      # trends needs no account or model, which is why it is the default here.
      # To use a model instead, set QUERY_SOURCE=llm and give OLLAMA_HOST an
      # address the container can reach: localhost inside a container is the
      # container, so ollama running on the host is host.docker.internal, and
      # 0.0.0.0 is a bind address that cannot be dialled at all.
      #
      #   QUERY_SOURCE=llm OLLAMA_HOST=host.docker.internal:11434 docker compose run --rm rewards-farmer
      QUERY_SOURCE: ${QUERY_SOURCE:-trends}
      REWARDS_HEADLESS: "1"
      # Edge runs headed on the virtual display with-xvfb provides (see command
      # below) rather than headless: headless Edge is not credited for the
      # Explore on Bing cards. The scheduler services do the same.
      REWARDS_VIRTUAL_DISPLAY: "1"
      # Comma separated, one profile directory each. Leave unset for a single
      # profile in data-dir, which is the existing behaviour.
      REWARDS_ACCOUNTS: ${REWARDS_ACCOUNTS:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
    command: ["with-xvfb", "python", "src/main.py"]
    volumes:
      # Keeps the sign-in across container rebuilds.
      - ./data-dir:/app/data-dir
      # The visual search task uploads this file, which is gitignored and so is
      # never in the image. Create it first with
      # `python src/random_image_for_visual_search.py`; a path that does not
      # exist yet is mounted as an empty directory rather than a file.
      - ./visual_search.jpg:/app/visual_search.jpg:ro

  # Runs main.py once a day, unattended, at an anchor hour plus a random
  # jitter (src/daily_loop.py) instead of the same wall-clock moment every
  # day. Lives in the container rather than the NAS's own crontab so the
  # schedule travels with this repo instead of being a manual edit to shared
  # host state (/etc/crontab is also used by this NAS's other containers).
  # restart: unless-stopped keeps it running across NAS reboots; the loop
  # itself never exits on a purpose, so only a crash or `docker compose down`
  # should stop it.
  scheduler:
    build:
      context: .
      target: runtime
    image: rewards-farmer:runtime
    shm_size: 1gb
    restart: unless-stopped
    command: ["with-xvfb", "python", "src/daily_loop.py"]
    # See the rewards-farmer service above for why cpus is left unset.
    deploy:
      resources:
        limits:
          memory: 1536M
    environment:
      QUERY_SOURCE: ${QUERY_SOURCE:-trends}
      REWARDS_HEADLESS: "1"
      REWARDS_VIRTUAL_DISPLAY: "1"
      REWARDS_ACCOUNTS: ${REWARDS_ACCOUNTS:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      # Hour to anchor the run to, and how many seconds after that hour the
      # actual start may be delayed by, both in TZ below rather than UTC.
      REWARDS_ANCHOR_HOUR: ${REWARDS_ANCHOR_HOUR:-9}
      REWARDS_JITTER_SECONDS: ${REWARDS_JITTER_SECONDS:-10800}
      TZ: ${TZ:-America/New_York}
      # search-scheduler below already spreads the required searches across
      # the day; without this the once-a-day run would redo them in one batch
      # right after the last spread-out run, undoing the point of spreading
      # them at all.
      REWARDS_SKIP_SEARCHES: "1"
    volumes:
      - ./data-dir:/app/data-dir
      - ./visual_search.jpg:/app/visual_search.jpg:ro

  # Runs src/search_only.py (required searches only) a handful of times a day
  # at random points within waking hours (src/search_scheduler.py), rather
  # than all 25 in one sitting the way the once-a-day `scheduler` run above
  # would. Separate from `scheduler` because the daily set/explore/misc/bonus
  # tasks above genuinely only make sense once a day, while search timing is
  # what most obviously reads as bot-like when batched.
  search-scheduler:
    build:
      context: .
      target: runtime
    image: rewards-farmer:runtime
    shm_size: 1gb
    restart: unless-stopped
    command: ["with-xvfb", "python", "src/search_scheduler.py"]
    # See the rewards-farmer service above for why cpus is left unset.
    deploy:
      resources:
        limits:
          memory: 1536M
    environment:
      QUERY_SOURCE: ${QUERY_SOURCE:-trends}
      REWARDS_HEADLESS: "1"
      REWARDS_VIRTUAL_DISPLAY: "1"
      REWARDS_ACCOUNTS: ${REWARDS_ACCOUNTS:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      # How many times a day to run, and the waking-hours window (in TZ below)
      # they are randomly placed within.
      REWARDS_SEARCH_RUNS_PER_DAY: ${REWARDS_SEARCH_RUNS_PER_DAY:-4}
      REWARDS_SEARCH_START_HOUR: ${REWARDS_SEARCH_START_HOUR:-8}
      REWARDS_SEARCH_END_HOUR: ${REWARDS_SEARCH_END_HOUR:-23}
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./data-dir:/app/data-dir
      - ./visual_search.jpg:/app/visual_search.jpg:ro

  # One off, before the first run. Opens the Rewards sign-in in a browser
  # inside the container and puts that browser on your screen as a web page,
  # so the profile is written by the same Edge that will later read it.
  #
  #   docker compose run --rm --service-ports signin
  #   REWARDS_ACCOUNTS=personal docker compose run --rm --service-ports signin
  #
  # --service-ports is not optional: `run` publishes nothing without it, and
  # the page then never loads, which reads as a broken feature rather than a
  # missing flag.
  #
  # This exists because Chromium takes its cookie key from the operating
  # system. Signed in on a Windows or macOS host that key is wrapped with
  # DPAPI or the login Keychain, and the container can unwrap neither, so the
  # profile arrives looking healthy and behaving as though it were logged out.
  signin:
    build:
      context: .
      target: signin
    image: rewards-farmer:signin
    shm_size: 1gb
    command: ["python", "src/signin.py"]
    environment:
      # One name. Signing in is one browser window, so one account at a time.
      REWARDS_ACCOUNTS: ${REWARDS_ACCOUNTS:-}
    ports:
      # Bound to the NAS's LAN IP for this one-time sign-in (SSH tunneling is
      # blocked by this NAS's sshd, AllowTcpForwarding no). Trusted home LAN
      # only, same as this NAS's other containers (qbit, sonarr, radarr).
      - "192.168.35.12:6080:6080"
    volumes:
      - ./data-dir:/app/data-dir
